<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Casos de uso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  {% include 'navbar.html' %}

  <main class="container">
    <h1 class="mb-4">Casos de uso</h1>
    <div class="list-group">
      {% for c in casos %}
        <a href="{{ url_for('caso', id=c.id) }}" class="list-group-item list-group-item-action">
          <h5 class="mb-1">{{ c.problema }}</h5>
          <small>{{ c.sector }} — {{ c.organizacion }}</small>
        </a>
      {% endfor %}
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
